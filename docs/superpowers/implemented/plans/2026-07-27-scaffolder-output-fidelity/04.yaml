tasks:
- number: 1
  title: --key
  steps:
  - id: P4.T1.S1
    text: |
      [RED] Add cases:
        - `--key ops-30-silent-failure` -> the appended entry's key is that, the `--only`/`--print-prompt` hint the script prints names that key, and the default cover filename derives from it
        - no --key -> key is `<series>-<number>` exactly as today (byte-compatible default)
        - `--key` with a value that is not a plain slug (spaces, quotes) -> exit non-zero (the key is a shortcode/CLI argument downstream; guard it like --entry-field keys are guarded at tools/blog-post-create.sh:51-52)
      Run: bash tests/run-unit.sh -k blog_post_create
      EXPECT: RED.
  - id: P4.T1.S2
    text: |
      [GREEN] Add the `--key <key>` flag. Do NOT attempt to detect a key convention from existing entries: the reporting blog's `ops-30-silent-failure` needs an `operating` -> `ops` abbreviation that exists nowhere in the config, so detection would be guesswork on the one field that names the entry (spec D6).
      Run: bash tests/run-unit.sh -k blog_post_create
      EXPECT: GREEN.
- number: 2
  title: output default follows the entries file's own convention
  steps:
  - id: P4.T2.S1
    text: |
      [RED] Add cases, seeding the entries file (via the P2 prompts_seed hook) with entries whose `output` values establish a convention:
        - existing covers under "blog/content/docs/.../cover.png" (frank-shaped) -> the new entry's `output` is "<site_dir>/content/docs/<series>/<NN>-<slug>/cover.png", i.e. INSIDE the bundle the same run just created
        - existing covers under "blog/static/images/..." -> `output` is "<output_dir>/<key>-cover.png", unchanged from today
        - a bare "images:\n" (no entries) -> `output_dir` default, unchanged from today
        - `--output <path>` beats detection in both shapes
      Also assert the generated cover actually lands at the resolved path in the bundle case (the run is BLOG_CRAFT_TEST_MODE, which writes a 1x1 PNG), so the path is real and not merely written into YAML.
      Run: bash tests/run-unit.sh -k blog_post_create
      EXPECT: RED.
  - id: P4.T2.S2
    text: |
      [GREEN] Call `prompts_append.py output-style` before composing the entry and pick the default from its answer (spec D7). Every blog in the field keeps its current default — detection only fires when the file itself says covers live in bundles.
      Run: bash tests/run-unit.sh -k blog_post_create
      EXPECT: GREEN.
- number: 3
  title: Verify (phase 4)
  steps:
  - id: P4.T3.S1
    text: |
      [VERIFY] bash tests/run-unit.sh && BLOG_CRAFT_TEST_MODE=1 PYTHON=python3 bash tests/smoke-blog-post.sh
      EXPECT: green.
