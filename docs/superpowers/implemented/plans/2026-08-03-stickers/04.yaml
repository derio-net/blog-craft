tasks:
- number: 1
  title: build-sheets.py — the print contract
  steps:
  - id: P4.T1.S1
    text: |
      [RED] New tests/unit/test_build_sheets.py. Build sheets from 18 synthetic solid-colour PNGs (Pillow is in the test venv):
        1. output is exactly 2480x3508;
        2. the saved PNG carries dpi == (300, 300) (reopen with Pillow and read .info["dpi"]) — this is what makes "print at 100%" map A4 1:1;
        3. cell size == min((2480 - 4*60)//3, (3508 - 4*60)//3) and the 3x3 grid is CENTRED: assert each cell's top-left offset equals off_x + c*(cell+gutter), off_y + r*(cell+gutter) by sampling the pixel at each expected corner;
        4. `pos` 1..9 maps left->right, top->bottom (divmod(pos-1, 3));
        5. a sticker whose image file is missing fails LOUDLY with the path in the message (never a blank cell);
        6. two sheets are produced when entries declare sheet 1 and 2, named <prefix>-A4-sheet1.png / -sheet2.png with the prefix from config, NOT hardcoded "frank-";
        7. entries lacking sheet/pos are skipped, not misplaced;
        8. page dimensions are DERIVED from size+dpi, not configured: size a4 + dpi 300 -> exactly 2480x3508 (round(210/25.4*300)=2480, round(297/25.4*300)=3508 — verified exact, these ARE frank's hardcoded constants). Assert a4+600dpi doubles them;
        [CORRECTED during execution — this step asked for two FALSE assertions (phase-4 finding p4-two-false-assertions-in-plan-step, fixed):
         (a) `dpi == (300, 300)` does not read back literally. PNG stores resolution in the pHYs chunk as INTEGER px/metre, so 300dpi is written as 11811 px/m and Pillow reads back (299.9994, 299.9994). Assert round()-ed dpi PLUS the exact chunk (11811, 11811, 1) — which is byte-identical to frank's committed sheet. The integer chunk is the real print contract.
         (b) 600dpi does NOT double the width: round(210/25.4*600) = 4961, not 2*2480 = 4960, because round() is not linear (210/25.4*600 = 4960.63). The HEIGHT does double (7016 = 2*3508), which is what makes the trap plausible. Assert the DERIVATION per axis, never a scale factor.
         Consequence for phase 8 docs: never write "at 600 dpi the sheet is twice as large"; write "derived per axis, round(mm/25.4*dpi)".]
        9. an UNRECOGNISED size exits non-zero naming the value and the known sizes — validate_config deliberately does not check size (phase-3 discovery p3-stickers-validation-semantics), so this script is the only guard;
        10. grid genuinely works: grid [2,4] lays out 2 columns x 4 rows with pos valid 1..8 and pos 9 rejected; and grid [3,3] reproduces frank's exact cell size and offsets (the generalised algebra must be numerically identical to the hardcoded 3 for frank's case — that equality IS the regression test).
      Run: bash tests/run-unit.sh -k test_build_sheets
      EXPECT: RED (script absent).
  - id: P4.T1.S2
    text: |
      [GREEN] Write templates/features/stickers/scripts/build-sheets.py, porting frank's blog/_private/frank-stickers/build-sheets.py (59 lines).
      Derive page dims from a known-sizes table in mm: SIZES = {"a4": (210, 297), "letter": (215.9, 279.4)}; W = round(mm_w/25.4*dpi). SystemExit on an unknown size.
      GENERALISE the gutter algebra to grid [cols, rows] — cell = min((W-(cols+1)*G)//cols, (H-(rows+1)*G)//rows); grid_w = cols*cell + (cols-1)*G; grid_h = rows*cell + (rows-1)*G; off = ((W-grid_w)//2, (H-grid_h)//2); divmod(pos-1, cols); pos valid 1..cols*rows. For cols=rows=3 this MUST reproduce frank's hardcoded numbers exactly (frank: cell = min((W-4G)//3, (H-4G)//3), grid = 3*cell+2*G) — if it does not, the algebra is wrong, not the test.
      Keep page.save(dest, dpi=(dpi, dpi)) — the DPI metadata is what makes "print at 100%" map the page 1:1, and without it the green keyline stops being a true cut path.
      Replace only the hardcoded inputs: read .blog-craft.yaml via tools/blog_config.py conventions for features.stickers.{prompts_file,images_dir,sheets_dir,sheet.{dpi,gutter,grid},sheets_prefix}; default sheets_prefix to a slug of project.name. Resolve paths against the config root, like generate-images.py does.
      Run: bash tests/run-unit.sh -k test_build_sheets
      EXPECT: green.
- number: 2
  title: generate-stickers.py — CLI-preserving shim over the shared engine
  steps:
  - id: P4.T2.S1
    text: |
      [RED] New tests/unit/test_generate_stickers_shim.py (BLOG_CRAFT_TEST_MODE=1):
        1. --list prints the sticker keys read from features.stickers.prompts_file (NOT image.prompts_file) with sheet/pos and description, like frank's --list;
        2. --only k1,k2 generates only those, into the default out dir `regen/`;
        3. the DEFAULT run writes into regen/ and leaves each entry's `output:` untouched — frank's non-destructive contract, inherited from P2.T2;
        4. --dry-run prints the FULL composed prompt and the resolved reference filenames, and makes no API call. Assert the printed prompt is NOT truncated: frank's own --dry-run cut it at 300 chars (generate-stickers.py:101), which is a defect, and the shim deliberately fixes it;
        5. an unknown key exits non-zero naming the valid keys;
        6. features.stickers absent or enabled:false -> exits non-zero with a message pointing at the config knob.
      Run: bash tests/run-unit.sh -k test_generate_stickers_shim
      EXPECT: RED.
  - id: P4.T2.S2
    text: |
      [GREEN] Write templates/features/stickers/scripts/generate-stickers.py: resolve features.stickers.prompts_file, then delegate to the sibling generate-images.py. NOTE (phase-2 discovery p2-out-dir-contract-for-phase4): --out is CWD-relative like --reference, so the shim MUST pass an ABSOLUTE path, resolved against the config root. Also: a --count N run needs curation.archive_cap >= N or the FIFO prunes its own variants mid-run (import it as a module rather than shelling out, so a traceback is legible) with --out defaulting to "regen". Map frank's flags: --list, --only, --out, --dry-run (-> per-key --print-prompt plus the resolved refs).
      Comment the WHY: frank's README documents this exact CLI; preserving it means the operator's runbook and muscle memory survive the port, which is part of "no behavioral changes".
      Run: bash tests/run-unit.sh -k "test_generate_stickers_shim or test_generate_images"
      EXPECT: green.
- number: 3
  title: bootstrap-render.sh gates both scripts on features.stickers.enabled
  steps:
  - id: P4.T3.S1
    text: |
      [RED] Extend tests/unit/test_features_gating.py:
        1. features.stickers ABSENT -> neither sticker script is materialized (pre-v7 configs, and any blog whose config predates the migration);
        2. features.stickers.enabled false -> neither is materialized. BOTH shapes matter and neither is hypothetical: after migration 006_to_007 every UPDATED blog carries {enabled: false} explicitly, so `disabled` is the common case and `absent` is the legacy one (phase-3 note). stk-4's acceptance wording should say "disabled", not "absent";
        3. true -> BOTH land at <site_dir>/scripts/;
        4. classification: both resolve to class `framework` and root `site` via the EXISTING manifest rows (scripts/**) — assert via tools/path_ownership.classify, and assert tests/unit/test_path_roots.py's exactly-one-match requirement still holds for the two new paths.
      Run: bash tests/run-unit.sh -k "test_features_gating or test_path_roots"
      EXPECT: RED.
  - id: P4.T3.S2
    text: |
      [GREEN] tools/bootstrap-render.sh: add a stickers block mirroring the glossary gate at lines 118-123 (read features.stickers.enabled via the renderer's --get-bool, default false, copy templates/features/stickers/scripts/* into the staging scripts dir, else echo a SKIPPED line). Default-OFF semantics: absence means off, unlike the mermaid_view block above it which is default-on — follow glossary, not mermaid_view.
      Run: bash tests/run-unit.sh -k "test_features_gating or test_path_roots or test_mirrors"
      EXPECT: green.
- number: 4
  title: Run-level contact sheet — the artifact Decision 6 alone does not produce
  steps:
  - id: P4.T4.S1
    text: |
      [RED] Extend tests/unit/test_generate_stickers_shim.py:
        1. a run generating >=2 keys writes <out>/contact-sheet.png;
        2. that sheet is laid out cols=5, tile_width=420 (assert the resulting .size) — frank's COLUMN COUNT and tile width, but blog-craft's LAYOUT. Do NOT try to match frank's pixel output: its helper frank/scripts/lib/contact_sheet.py was deleted by frank's own cutover bd0415e6 and used a different algorithm (aspect-preserving thumbs, label strip along the BOTTOM, background-coloured trailing cells) vs _contact_sheet's top-label fixed 400x260 tile. The divergence is ACCEPTED and phase 8 declares it in the CHANGELOG — see the Decision 6 correction in the spec;
        3. its tiles are the GENERATED KEYS (one per key), labelled by key — not the variants of a single key;
        4. a run generating exactly 1 key writes NO contact sheet (frank's threshold is >=2, generate-stickers.py:141);
        5. the engine's own per-key .regen-archive sheet is unaffected (still only on --count > 1).
      Run: bash tests/run-unit.sh -k test_generate_stickers_shim
      EXPECT: RED.
  - id: P4.T4.S2
    text: |
      [GREEN] In the shim, after delegating generation, import _contact_sheet from the sibling generate-images.py and build the run-level sheet over the keys that succeeded, at <out>/contact-sheet.png, cols=5, tile_width=420, only when >=2 succeeded.
      WHY this lives in the shim and not the engine (phase-2 finding p2-decision6-insufficient-for-frank-sheet): the engine's sheet is per-KEY across that key's variants and fires only on --count > 1; frank's is per-RUN across keys and fires on >=2 keys. frank generates one image per key, so the engine's sheet is never produced. These are different artifacts, so the sticker-workflow layer owns the sticker-workflow one. Do NOT change the engine's per-key sheet.
      Run: bash tests/run-unit.sh -k "test_generate_stickers_shim or contact_sheet"
      EXPECT: green.
