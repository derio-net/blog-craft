tasks:
- number: 1
  title: Error-severity checks
  steps:
  - id: P4.T1.S1
    text: |
      [RED] Create tests/unit/test_glossary_validator.py, modelled on tests/unit/test_educational_validator.py. Cases returning errors:
        - a post containing {{< abbr "XYZ" >}} with XYZ absent from the registry -> error naming the file, line and term
        - a registry entry missing `name`, or with an empty/whitespace `name` -> error
        - a registry entry missing `description`, or empty -> error
        - `url` present but not absolute http(s) -> error
        - two registry keys differing only in case (NUT and Nut) -> error
        - a clean post + clean registry -> no errors, exit 0
      Run: bash tests/run-unit.sh -k glossary_validator
      EXPECT: RED.
  - id: P4.T1.S2
    text: |
      [GREEN] Create tools/validate_glossary.py with the house docstring shape and `validate_glossary(registry, marked) -> (errors, warnings)` as the library entry point, plus a marker extractor that reuses glossary_scan's shortcode span logic where it can. CLI: `validate_glossary.py --config <cfg> <paths…>`, exit 1 on any error.
      Run: bash tests/run-unit.sh -k glossary_validator
      EXPECT: GREEN.
- number: 2
  title: Warning-severity checks and exit codes
  steps:
  - id: P4.T2.S1
    text: |
      [RED] Add cases:
        - a registry entry no post references -> WARNING, exit still 0
        - registry keys not alphabetically sorted -> WARNING, exit still 0
        - warnings print to stderr, errors print to stderr, the OK line to stdout (match validate_config.py's convention)
        - errors AND warnings together -> exit 1
      Run: bash tests/run-unit.sh -k glossary_validator
      EXPECT: RED.
  - id: P4.T2.S2
    text: |
      [GREEN] Implement warnings + exit-code logic.
      Run: bash tests/run-unit.sh -k glossary_validator
      EXPECT: GREEN.
- number: 3
  title: Mirror into the blog template and enroll in the drift guard
  steps:
  - id: P4.T3.S1
    text: |
      [RED] Add the pair ("tools/validate_glossary.py", "templates/hugo-hextra/scripts/validate_glossary.py") to the MIRRORS list in tests/unit/test_mirrors.py, and extend that file's module docstring with the new row.
      Run: bash tests/run-unit.sh -k mirrors
      EXPECT: RED — FileNotFoundError, the mirror does not exist yet.
  - id: P4.T3.S2
    text: |
      [GREEN] cp tools/validate_glossary.py templates/hugo-hextra/scripts/validate_glossary.py
      Run: bash tests/run-unit.sh -k mirrors
      EXPECT: GREEN — every mirrored pair byte-identical.
      NOTE: the mirror is unconditional (it ships to every blog like validate_mermaid.py does); only the CI *step* that runs it is feature-gated. This is deliberate — it keeps templates/manifest.yaml's `scripts/**` framework rule and the reproduction harness untouched.
- number: 4
  title: Verify (phase 4)
  steps:
  - id: P4.T4.S1
    text: |
      [VERIFY] bash tests/run-unit.sh
      EXPECT: green apart from the known explainers flake.
