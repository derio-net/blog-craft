tasks:
- number: 1
  title: agents/cold-reader.md
  steps:
  - id: P4.T1.S1
    text: |
      [RED] Create tests/unit/test_cold_reader_contract.py:
        - agents/cold-reader.md exists; its frontmatter tools line lists ONLY Read, Grep, Glob (parse the yaml frontmatter like existing agent-frontmatter tests do, or regex the tools line)
        - body contains the five critique section names: "Takeaway mirror", "Lost points", "Session residue", "Arc assessment", "AI-tell instances"
        - body contains a blindness statement (the string "never" near "session" — assert on an exact sentence you author in S2, e.g. "You receive only the draft and the methodology — never the session context, the evidence brief, or the source repo.")
      Run: bash tests/run-unit.sh -k cold_reader
      EXPECT: RED.
  - id: P4.T1.S2
    text: |
      [GREEN] Author agents/cold-reader.md mirroring agents/post-researcher.md frontmatter shape (name: cold-reader; description: blind editor critiquing a draft as a first-time reader — no session context; tools: Read, Grep, Glob). Body:
        - Role: you are a cold reader — a competent technical reader who was NOT in the session. Include verbatim: "You receive only the draft and the methodology — never the session context, the evidence brief, or the source repo."
        - Inputs: the draft path; the methodology paths (educational-writing SKILL.md, references/reader-arc.md, references/ai-tells.md).
        - Output: a markdown critique with exactly five sections:
          1. Takeaway mirror — what you understood and would retain, in your own words (the dispatcher diffs this against reader_goal)
          2. Lost points — where you needed context the post assumes but never gives (quote the passage)
          3. Session residue — passages only meaningful to someone who was there (quote each)
          4. Arc assessment — is the beginning sized to how idiosyncratic the meat is; does the end transfer or merely recap
          5. AI-tell instances — concrete hits against ai-tells.md (quote + pattern name)
        - Rules: quote exact draft text for every criticism; no rewriting the post yourself; no praise padding; if a section has no findings say "none".
      Run: bash tests/run-unit.sh -k cold_reader
      EXPECT: GREEN.
- number: 2
  title: Wire /blog-post and /post-rewrite
  steps:
  - id: P4.T2.S1
    text: |
      [RED] Extend test_cold_reader_contract.py with wiring greps:
        - skills/blog-post/SKILL.md: Step 4's methodology-load paragraph names reader-arc.md and ai-tells.md; a cold-reader dispatch sub-step exists between composing and the approve question (assert strings "cold-reader" and "critique"); Step 0 seeds quality.lint.enabled (assert "quality.lint.enabled" appears in the Step 0 block).
        - skills/post-rewrite/SKILL.md: names reader-arc.md, ai-tells.md, and contains the same cold-reader dispatch language.
      Run: bash tests/run-unit.sh -k cold_reader
      EXPECT: RED.
  - id: P4.T2.S2
    text: |
      [GREEN] Edit both SKILL.md files:
        blog-post Step 0: add a second seed_config.py invocation seeding quality.lint.enabled (default true, comment "Warnings-first AI-tells lint; severities/thresholds in docs/CONFIG.md.", values "true,false").
        blog-post Step 4: extend the load instruction to name references/reader-arc.md and references/ai-tells.md explicitly; after the body-composition paragraphs and BEFORE the approval question insert a "Cold-reader critique" sub-step: dispatch the cold-reader subagent (agents/cold-reader.md) with ONLY the draft file path and the three methodology paths — never the evidence brief, session notes, or source-repo path; revise the draft against the critique (fix session residue and lost points; resize the landscape; apply ai-tells fixes); when showing the draft to the user include a one-paragraph summary of what the critique changed. The existing regen loop re-dispatches naturally.
        post-rewrite: mirror the same load-list extension and dispatch sub-step at the equivalent point (after re-shape, before presenting).
      Run: bash tests/run-unit.sh -k cold_reader
      EXPECT: GREEN.
- number: 3
  title: Verify (phase 4)
  steps:
  - id: P4.T3.S1
    text: |
      [VERIFY] bash tests/run-unit.sh
      EXPECT: full suite green (contract tests for opencode namespace must also still pass; if the opencode mirror requires a sync for the new/changed skills, run the repo's sync tool and include the regenerated files).
