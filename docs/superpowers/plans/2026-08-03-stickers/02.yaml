tasks:
- number: 1
  title: image.fallback_model and image.timeout_ms
  steps:
  - id: P2.T1.S1
    text: |
      [RED] New tests/unit/test_generate_images_fallback.py. `_gen_bytes` imports `from google import genai` INSIDE the function, so a fake module injected into sys.modules is picked up without google-genai installed. Note BLOG_CRAFT_TEST_MODE=1 short-circuits before the client, so these tests must NOT set it.
        1. primary model raises -> `image.fallback_model` is attempted and its bytes returned;
        2. primary succeeds -> fallback NEVER attempted (assert the fake records one call);
        3. both raise -> the run reports failure for that key and exits non-zero (no silent empty PNG);
        4. `image.timeout_ms` reaches genai.types.HttpOptions(timeout=...);
        5. no `fallback_model` configured -> single attempt, current behavior byte-for-byte.
      Run: bash tests/run-unit.sh -k test_generate_images_fallback
      EXPECT: RED.
  - id: P2.T1.S2
    text: |
      [GREEN] templates/hugo-hextra/scripts/generate-images.py `_gen_bytes`: read `image_cfg.get("fallback_model")` and `image_cfg.get("timeout_ms")`; pass HttpOptions(timeout=timeout_ms) into GenerateContentConfig.http_options when set; wrap the generate_content call in a loop over [model, fallback_model] (skipping None), logging each failure to stderr with the model name, returning on first success. Comment the WHY: the primary is a *preview* model (gemini-3-pro-image-preview) and frank's sticker script carried this fallback for exactly that reason (generate-stickers.py:123).
      Run: bash tests/run-unit.sh -k "test_generate_images"
      EXPECT: green, and the existing v5/reference tests still pass.
- number: 2
  title: '--out <dir>: never write the entry''s output: path'
  steps:
  - id: P2.T2.S1
    text: |
      [RED] New tests/unit/test_generate_images_out_dir.py (BLOG_CRAFT_TEST_MODE=1 is fine here — it exercises the write path, not the API):
        1. with --out DIR, DIR/<key>.png is created;
        2. with --out DIR, a PRE-EXISTING file at the entry's `output:` is byte-UNCHANGED (this is the data-loss guard, stk-2);
        3. with --out DIR and no pre-existing output:, that path is still not created at all;
        4. WITHOUT --out, `output:` is written exactly as today (regression);
        5. --out combines with --only (a subset regenerates into DIR);
        6. --out with --count N>1 writes N variants into DIR and still writes no `output:`.
      Run: bash tests/run-unit.sh -k test_generate_images_out_dir
      EXPECT: RED (flag absent).
  - id: P2.T2.S2
    text: |
      [GREEN] Add `--out` to the argparse block and thread it to the write site. Where the code currently does `out.write_bytes(variants[-1][1].read_bytes())`, branch: when --out is given, write each variant to `<out>/<key>.png` (last wins for the bare name) and SKIP the `output:` write and the post_process step entirely (post-processing targets the published asset). Archive entries still land in .regen-archive as today.
      Docstring/comment the WHY: frank's sticker workflow is "generate into regen/, pick a winner, copy it over the master" (frank-stickers/README.md:28-29). Writing `output:` on every regen would destroy the curated sticker master — the artifact the whole print workflow exists to protect.
      Run: bash tests/run-unit.sh -k test_generate_images
      EXPECT: green.
- number: 3
  title: _contact_sheet geometry is parameterizable
  steps:
  - id: P2.T3.S1
    text: |
      [RED] Extend tests/unit/test_generate_images_out_dir.py (or a small test_contact_sheet.py):
        1. default call is byte-identical to today's output for the same inputs — cols=min(len,3), tile 400x260 (pin the resulting image .size);
        2. explicit cols=5, tile_width=420 produces a 5-wide sheet with 420px tiles;
        3. cols larger than the image count clamps to the count (no empty columns).
      Run: bash tests/run-unit.sh -k contact_sheet
      EXPECT: RED.
  - id: P2.T3.S2
    text: |
      [GREEN] Change the signature to `_contact_sheet(images, out, cols=None, tile_width=400, tile_height=260)`; `cols = min(len(images), cols or 3)`; derive tile height proportionally only if tile_height is None (keep 260 default so existing output is unchanged). Existing call site passes nothing.
      Comment the WHY: frank's sticker regen sheet is cols=5 / tile_width=420; letting it silently reflow to 3 columns is a visible change to an artifact the operator reviews by eye.
      Run: bash tests/run-unit.sh -k test_generate_images
      EXPECT: green.
