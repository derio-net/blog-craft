  - id: P7.T1.S1
    text: |
      [RED] Extend tests/unit/test_update_legacy_dests.py (or the nearest existing legacy_dests test — locate it first):
        1. legacy_dests maps scripts/build-sheets.py and scripts/generate-stickers.py to {site}/_private/frank-stickers/<name>;
        2. a blog carrying the file ONLY at the legacy path plans `relocate` — the operator's copy moves, it is not re-added blank;
        3. a blog carrying a correct copy at BOTH paths plans `prune` (the stale duplicate only);
        4. after apply, the legacy file is gone and the emptied _private/frank-stickers/ directory is pruned, with the site dir itself never removed;
        5. a blog that never had them is INERT — no relocate, no prune, nothing in the plan (this is the promise to gondor and stoa);
        6. {site} expands correctly for both site_dir: blog and a config-root site.
      Run: bash tests/run-unit.sh -k "legacy or test_update"
      EXPECT: RED.
  - id: P7.T1.S2
    text: |
      [GREEN] Add the two rows to templates/manifest.yaml's legacy_dests table, with a comment recording the third migration axis this adds: not a root change and not a rename, but a CAPABILITY ABSORPTION — a script that used to live in an operator's private directory is now shipped. Note explicitly that stickers.yaml, images/ and sheets/ are `content` and therefore NOT covered here; tools/migrate_stickers.py is their path.
      Run: bash tests/run-unit.sh -k "legacy or test_update or test_path"
      EXPECT: green.
