    title: CI requires the version bump with the first tools/ change
    body: "check_version_bump_needed.py fails the test job on any tools/ change without a bump; the bump moved from P4.T3 to phase 1. Bumped 0.22.7 -> 0.23.0 with a placeholder CHANGELOG entry (test_changelog.py needs a section for the shipped version); P4.T3 completes the entry."
  - kind: decision
    id: p1-line-numbers-via-prose-lines
    phase: 1
    title: Line numbers survive the reused fence rule by tagging each line's end
    body: "validate_educational._prose_lines drops lines, so it loses line numbers. The checker appends a NUL + index to each line before calling it (the fence match only reads the line start) and reads the indices back; validate_educational.py is unchanged (a spec non-goal)."
  - kind: decision
    id: p1-waiver-scope
    phase: 1
    title: An in-source waiver covers the next non-blank line; front matter waives page-level kinds only
    body: "A `<!-- writing-standard: ignore <check> -- reason -->` suppresses one hit of that check on the next non-blank line after the comment. `writing_standard_waive` accepts only page-level kinds (average_sentence_length) or names no check of the standard; naming a sentence-level check of the standard fails as waiver_reason, so front matter cannot switch a check off for a whole page."
  - kind: decision
    id: p1-unimplemented-kinds
    phase: 1
    title: The five P2 kinds are declared but have no matcher yet
    body: "KINDS declares all 12 kinds, so a standard naming one loads; run_checks raises StandardError (exit 2) for a kind with no matcher in MATCHERS, never a silent skip. P2 adds average_sentence_length, phrases, loose_sentences, nominalizations and abbreviations to MATCHERS."
