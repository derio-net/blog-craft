  - id: BPC-1
    capability: post-scaffold-fidelity
    acceptance: 'A scaffolded prompts entry leaves the entries file parseable whatever
      indentation the file''s own images: sequence uses'
    origin:
    - blog-craft:docs/superpowers/specs/2026-07-27-scaffolder-output-fidelity-design.md
    levels:
      unit:
      - blog-craft:tests/unit/test_prompts_append.py
      - blog-craft:tests/unit/test_blog_post_create.py
      int:
      - blog-craft:tests/smoke-blog-post.sh
    status: ci
    notes: '#65 item 1 (data-corrupting). tools/prompts_append.py detects the file''s
      own images: sequence indentation and blog-post-create.sh appends through it instead
      of `>>` at a hard-coded 2 spaces. Pinned at both levels: test_prompts_append.py
      drives column-0, 2-space, 4-space, empty-sequence and no-trailing-newline files
      directly; test_blog_post_create.py scaffolds end to end over each shape through
      a prompts_seed fixture hook and asserts the file still parses with exactly 2 entries.
      The column-0 seed is the diagnostic one — it reproduced the reported ParserError
      before the fix, and the newline-less seed reproduced the silent variant (the entry
      swallowed into the previous scene: block scalar, file still parsing, still 1 entry).
      The pre-existing empty-sequence seed could see neither, which is why 6 passing tests
      coexisted with the defect. smoke-blog-post.sh drives the real script end to end;
      its scene-line awk terminator was relaxed to ^[[:space:]]*- key: (hard-coded 2 spaces
      ran to EOF on a column-0 file). The indent is now read off the PARSED node''s start
      mark rather than a `^images\s*:` regex, after the adversarial verification found the
      regex missed a quoted `"images":` key and silently fell back to 2 — pinned by
      test_a_quoted_images_key_appends_at_the_files_own_indent (unit) and
      test_a_quoted_images_key_scaffolds_at_the_files_own_indent (end to end).'
  - id: BPC-2
    capability: post-scaffold-fidelity
    acceptance: An append that would corrupt the entries file fails loudly and leaves
      the file byte-identical
    origin:
    - blog-craft:docs/superpowers/specs/2026-07-27-scaffolder-output-fidelity-design.md
    levels:
      unit:
      - blog-craft:tests/unit/test_prompts_append.py
      - blog-craft:tests/unit/test_blog_post_create.py
      int:
      - blog-craft:tests/smoke-blog-post.sh
    status: ci
    notes: '#65 spec D2 — the verify-after-write pass, the thing that makes this whole
      bug class loud rather than silent. prompts_append.py re-parses after writing (file
      loads, images is still a list, grown by exactly one, last key == the new key) and
      restores the pre-append bytes on any failure. test_prompts_append.py asserts the
      refusals byte-for-byte: an unparseable file, images: as a mapping, and a missing
      images: key all exit 2 with the parser error and leave the file unchanged.
      test_blog_post_create.py::test_broken_entries_file_fails_loudly_and_is_left_alone
      carries the consequence that matters — a refused append propagates through
      `set -euo pipefail`, so generate-images.py never runs over a corrupt file.
      Strengthened after the #65 code review, which found "byte-identical" was only
      true for a write that COMPLETED: the write is now a sibling temp file plus
      os.replace and the verification re-reads the bytes from disk, pinned by
      test_a_write_that_cannot_complete_leaves_the_file_byte_identical (a real short
      write under `ulimit -f 2` — exit 2 with a message, no traceback, no temp file
      left, file byte-identical). Two more refusals joined the same set: a top-level
      key AFTER the images: sequence (an end-of-file append cannot be correct for it)
      and the check-before-scaffold ordering, so a refusal leaves no half-written page
      bundle — test_a_top_level_key_after_the_sequence_is_refused_with_an_accurate_message,
      test_a_refused_append_leaves_no_half_scaffolded_post,
      test_a_trailing_top_level_key_is_refused_up_front_with_an_accurate_message and the
      `check` subcommand cases. Both file reads are explicit UTF-8
      (test_a_non_ascii_entry_block_appends_under_a_c_locale,
      test_detection_is_not_locale_dependent): every composed entry carries an em dash,
      so the locale-dependent read failed the append under LC_ALL=C and — worse, because
      the except swallowed it — silently answered output_dir for a bundle-style blog.
      test_a_kept_block_scalar_keeps_its_trailing_blank_line closes the recorded
      p1-keep-chomp-seam edge: the seam ensures a final newline instead of collapsing
      the ones already there. Strengthened again after the adversarial verification of
      that review commit, which REFUTED two of its fixes. (a) The "images: last" check
      was a line scanner whose premise ("column-0 content cannot occur inside the
      sequence") is false, so it REFUSED valid files — a hand-wrapped `description:`,
      a `tags: [one,\ntwo]` — and killed every scaffold on such a blog. It is now
      yaml.compose()''s own key order, pinned by
      test_column_zero_continuations_are_not_trailing_keys (four valid files),
      test_an_explicit_document_end_marker_is_named_for_what_it_is and
      test_a_multi_document_stream_is_named_for_what_it_is (a `...` marker used to be
      reported as "a top-level key `...`"), plus
      test_a_hand_wrapped_description_does_not_block_the_scaffold end to end. (b) `check`
      passed five files `append` then refused (flow-style values, a quoted `images` key),
      leaving content/docs/.../index.md on disk — it modelled the refusal predicates but
      neither the indent resolution nor the verification. `check` now runs the entire
      append in memory over the real entry block and does not write:
      test_check_answers_exactly_what_append_would_do (all five inputs, exit codes must
      match), test_a_flow_style_images_value_is_refused_with_an_accurate_message,
      test_every_images_shape_scaffolds_all_or_nothing and
      test_the_preflight_is_handed_the_real_entry_block (the compose -> check -> bundle ->
      append order). Two more crash paths closed: a close() that raises no longer leaks a
      sibling .tmp or masks the errno with EBADF
      (test_a_close_that_raises_still_unlinks_the_temp_file_and_keeps_the_errno), and a
      RecursionError from a deeply nested document is treated as an unreadable file rather
      than an exit-1 traceback (test_a_deeply_nested_document_is_refused_without_a_traceback,
      test_check_refuses_a_deeply_nested_document_without_a_traceback,
      test_output_style_never_fails_on_an_unreadable_document).'
