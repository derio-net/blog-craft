# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-27-update-base-config-snapshot
repo: derio-net/blog-craft
rows:
  - id: UB-1
    capability: update-base-fidelity
    acceptance: The 3-way merge base is rendered from the config as of the last sync,
      not the operator's current (possibly just-edited) config
    origin:
    - spec:2026-07-27-update-base-config-snapshot
    levels:
      unit:
      - blog-craft:tests/unit/test_update_base_snapshot.py
      - blog-craft:tests/unit/test_sync_state.py
      int:
      - blog-craft:tests/smoke-update.sh
    status: ci
    notes: update.render_base prefers .blog-craft.sync.yaml over the live config; unit
      tests pin the selection (snapshot wins, absent falls back with a warning, an unrenderable
      snapshot degrades rather than aborting) and smoke-update drives the whole path
      through a real git-archive base render.
  - id: UB-2
    capability: update-base-fidelity
    acceptance: Enabling a features.* flag lands that feature's contribution in merged-class
      files on the very run that enables it
    origin:
    - spec:2026-07-27-update-base-config-snapshot
    levels:
      unit:
      - blog-craft:tests/unit/test_update_base_snapshot.py
      int:
      - blog-craft:tests/smoke-update.sh
    status: ci
    notes: 'blog-craft#60''s headline symptom: features.glossary toggled on never added
      the Validate glossary CI step. smoke-update''s toggle leg asserts the step reaches
      .github/workflows/blog-ci.yml; a negative control (snapshot removed, forcing the
      pre-fix path) leaves it absent, so the assertion has teeth.'
  - id: UB-3
    capability: update-base-fidelity
    acceptance: A 3-way merge that changes nothing on disk is reported as a distinct
      NOOP outcome, never as MERGE
    origin:
    - spec:2026-07-27-update-base-config-snapshot
    levels:
      unit:
      - blog-craft:tests/unit/test_update_flow.py
      int:
      - blog-craft:tests/smoke-update.sh
    status: ci
    notes: Reporting half of blog-craft#60 — a MERGE that writes nothing was indistinguishable
      from one that writes something. plan_update now emits `noop`; apply_plan skips
      it and the dry-run tallies it separately.
  - id: UB-4
    capability: update-base-fidelity
    acceptance: A blog with no sync snapshot still updates, warns that its base is approximate,
      and records a snapshot so the next update is exact
    origin:
    - spec:2026-07-27-update-base-config-snapshot
    levels:
      unit:
      - blog-craft:tests/unit/test_update_base_snapshot.py
    status: ci
    notes: 'Backward compatibility for every blog synced before this fix; the warning
      is the signal whose absence made #60 invisible.'
  - id: UB-5
    capability: update-base-fidelity
    acceptance: 'The run that backfills the first snapshot names the merged paths it
      may have frozen, so a pre-existing #60 drop is still visible once'
    origin:
    - spec:2026-07-27-update-base-config-snapshot
    levels:
      unit:
      - blog-craft:tests/unit/test_update_base_snapshot.py
    status: ci
    notes: 'Recording the first snapshot fixes every future update but baselines whatever
      the tree holds — including a change an earlier pre-#60 run already dropped; from
      the next run that path is an ordinary NOOP with no warning. update.baselined_by_fallback
      lists them on the one run that can still tell. Pinned in both directions: fires
      on a fallback-base run with NOOPs, silent on a snapshot-backed run and on a fallback
      run with none, and reports mapped destinations (site_dir-aware).'
