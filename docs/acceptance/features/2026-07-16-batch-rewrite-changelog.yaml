# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-16-batch-rewrite-changelog
repo: derio-net/blog-craft
rows:
  - id: changelog-hoists-conventions
    capability: batch post-rewrite workflow
    acceptance: assemble_changelog hoists items common to every post into the Conventions
      table and leaves per-post residuals
    origin:
    - spec:2026-07-16-batch-rewrite-changelog
    levels:
      unit:
      - blog-craft:tests/unit/test_assemble_changelog.py
    status: ci
    notes: tools/assemble_changelog.py set-intersection dedup (#28)
  - id: changelog-no-batch-headers
    capability: batch post-rewrite workflow
    acceptance: the assembled changelog carries no batch section headers
    origin:
    - spec:2026-07-16-batch-rewrite-changelog
    levels:
      unit:
      - blog-craft:tests/unit/test_assemble_changelog.py
    status: ci
    notes: 'frank format; per-post ### tables only (#28)'
