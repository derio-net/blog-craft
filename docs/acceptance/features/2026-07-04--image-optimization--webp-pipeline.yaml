# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-04--image-optimization--webp-pipeline
repo: derio-net/blog-craft
rows:
  - id: IMG-OPT-1
    capability: image-optimization
    acceptance: WebP pipeline reduces image transfer size without visible quality loss
    origin:
    - spec:2026-07-04--image-optimization--webp-pipeline
    levels: {}
    status: not-implemented
    notes: 'Post-merge, operator-driven on frank''s blog: DevTools network check + visual
      spot-check + PNG masters untouched'
  - id: IMG-OPT-2
    capability: image-optimization
    acceptance: Every rendered image path goes through opt-image — including the post
      cover, the largest image on the page
    origin:
    - spec:2026-07-04--image-optimization--webp-pipeline
    levels:
      unit:
      - blog-craft:tests/unit/test_image_optimize.py
    status: ci
    notes: 'Regression guard for #53. docs/single.html shipped a raw <img> for the cover
      while list.html/render-image.html/screenshot.html/site-banner.html all used the
      partial, so the biggest asset on the page skipped WebP, maxWidth capping and srcset.
      The pre-existing test could not see it: its fixture leaves content_types.papers
      off, so the layout carrying the cover was never materialized. test_post_cover_is_optimized
      enables papers, drops a 2400px cover.png, and asserts capped WebP + srcset over
      a real Hugo build.'
  - id: IMG-GEN-POSTPROCESS
    capability: image-generation
    acceptance: post_process derivative steps share one contract — every step writes
      to an optional target, so one master can fan out to many derivatives in a pass
    origin:
    - spec:2026-07-04--image-optimization--webp-pipeline
    levels:
      unit:
      - blog-craft:tests/unit/test_post_process_steps.py
    status: ci
    notes: 'Regression guard for #53. crop_resize and ico already honoured target (and
      ico took size as a square shorthand); resize alone always clobbered the source,
      making a favicon set inexpressible — each resize destroyed the source the next
      step read. post_process() had no test coverage at all, which is how the three
      steps drifted. Pins target/size on resize, the unchanged width/height-no-target
      default, and the end-to-end favicon fan-out.'
