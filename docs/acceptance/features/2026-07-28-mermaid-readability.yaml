# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-28-mermaid-readability
repo: derio-net/blog-craft
rows:
  - id: mmd-1
    capability: Mermaid readability
    acceptance: Every mermaid diagram renders at its authored size regardless of the
      content column width
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_view.py
    status: ci
    notes: 'CSS: mermaid''s inline max-width caps ''width: 200rem'' to min(200rem, natural).
      Verified in design against 182 frank diagrams (183-2394px). test_mermaid_view.py
      pins the shipped rule (width: 200rem present, no competing max-width on the svg,
      block box so the inherited text-align: center cannot make a wide diagram''s left
      edge unreachable) AND the wiring phase 3 added: head-end.html loads mermaid-view.css
      before custom.css, and a real bootstrap render materializes the module. Flipped
      to ci in phase 7 now that both halves exist — the rule and the proof it reaches
      a built page.'
  - id: mmd-2
    capability: Mermaid readability
    acceptance: A diagram wider than the column exposes a visible scroll affordance
      without user interaction
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_view.py
    status: unwired
    notes: 'Verified live post-merge 2026-07-29 (Test Plan step 2, blog-craft#69 on
      main). With the

      feature materialized into a real Hextra build, the scroller reserves 9px of layout
      for a

      persistent bar (offsetHeight minus clientHeight is 9, versus 0 before the fix)
      and

      paints 4 scroll-shadow gradient layers with background-attachment local, local,
      scroll,

      scroll - both present without any user interaction. Not in CI because overlay-scrollbar

      behaviour is browser and OS state that no build assertion reaches; test_mermaid_view.py

      pins the CSS traps that CI can see.'
  - id: mmd-3
    capability: Mermaid diagram gates
    acceptance: A diagram exceeding the configured width budget fails the build
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_layout_gate.py
      - blog-craft:tests/unit/test_ci_template.py
    status: ci
    notes: 'Blocking, no baseline (operator decision). Default 1400px ~= 2x the 672px
      column. Two layers of evidence, both needed for the row''s literal wording ("fails
      THE BUILD"): test_mermaid_layout_gate.py proves the tool blocks (over-budget fails,
      at-budget passes, wide-ok waives, budget 0 disables loudly without launching a
      browser, browser discovery fails actionably); test_ci_template.py proves CI actually
      invokes it — the step renders after the Hugo build, at repo root with the site_dir
      prefix, and is omitted entirely at budget 0. Executed for real against frank''s
      built site: 35 of 203 diagrams blocked at 1400px, widest 2394px, 0 render errors.
      203 not 182 because built-HTML extraction also catches shortcode-emitted quadrantCharts
      that no markdown scan sees.'
  - id: mmd-3-host-honest
    capability: Mermaid diagram gates
    acceptance: Every width-gate verdict names the browser build and platform that measured
      it, and a pass within the margin below the budget warns that another host can
      fail it
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_layout_gate.py
    status: ci
    notes: '#75: frank measured one diagram at 1395px on macOS Chrome (OK) and 1414px
      on ubuntu-latest (FAILED). Widths are text metrics, so they are host-dependent;
      the gate now says so instead of hiding it. --margin (default 3%) warns, non-blocking,
      for diagrams in [budget*(1-margin), budget]; the blocking budget is unchanged.
      Pinning the measurement fonts is the longer-term fix and is not attempted here.'
  - id: mmd-4
    capability: Mermaid diagram gates
    acceptance: A disabled diagram gate reports that it is disabled and how many findings
      it would have reported
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_validator.py
    status: ci
    notes: 'Before phase 4, quality.mermaid_syntax:false printed a neutral line and
      exited 0 — indistinguishable from a pass; frank shipped a 50-finding backlog behind
      it. The gate now always SCANS and, when disabled, prints "GATE DISABLED (quality.mermaid_syntax:
      false) — would report N finding(s) across M file(s) checked" plus every finding,
      still exiting 0. Pinned by test_cli_disabled_gate_still_scans_and_reports_count
      and test_cli_disabled_gate_clean_reports_zero_findings (both mutation-checked:
      hardcoding the count, dropping the finding list, and flipping the branch each
      produce a named failure). test_mirrors.py keeps the shipped templates/hugo-hextra/scripts/
      copy byte-identical.'
  - id: mmd-5
    capability: Mermaid readability
    acceptance: A blog can opt out of the framed scroller and keep the previous rendering
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_view.py
      - blog-craft:tests/unit/test_bootstrap_render_gates.py
    status: ci
    notes: 'features.mermaid_view defaults true; migration 005_to_006 writes it for
      existing blogs and leaves an explicit false alone. Directly asserted by test_bootstrap_materializes_mermaid_view_true_false_and_absent,
      which runs a real bootstrap render for all three states: false => neither the
      stylesheet nor the render-hook override is materialized (prior rendering intact),
      true and ABSENT => both are. The absent case is the load-bearing one — this is
      the first features.* gate where absent means TRUE, so bootstrap-render.sh checks
      --has before --get-bool rather than defaulting to false like every other flag.
      That asymmetry is now guarded from the other side too: test_bootstrap_render_gates.py
      asserts all nine gate defaults as WHOLE log lines, and this is the only one whose
      absent-key line is the rendering one rather than a SKIPPED one (row brg-1).'
  - id: mmd-6
    capability: Mermaid readability
    acceptance: A scrollable diagram container is reachable and scrollable by keyboard
    origin:
    - spec:2026-07-28-mermaid-readability
    levels:
      unit:
      - blog-craft:tests/unit/test_mermaid_view.py
    status: unwired
    notes: 'Verified live post-merge 2026-07-29 (Test Plan step 4, blog-craft#69 on
      main). The

      mermaid pre element carries tabindex=0, takes focus (document.activeElement matches)
      and

      scrolls, and that state survives a dark/light toggle - which re-renders the diagram
      by

      resetting innerHTML. Not in CI because focus and scrolling are live-DOM behaviour.

      Journal finding dd6c3194d9f2 stays open - a focusable pre inside the theme''s
      role=img

      wrapper is an accepted a11y tension, not yet checked with a screen reader.'
